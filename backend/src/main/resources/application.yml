spring:
  application:
    name: certichain
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

certichain:
  jwt:
    secret: ${JWT_SECRET:dev-only-certichain-jwt-secret-change-me-32b}
    expiration-minutes: 720
  chain:
    rpc-url: ${CHAIN_RPC_URL:http://localhost:8545}
    chain-id: ${CHAIN_ID:31337}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:certichain}
    secret-key: ${MINIO_ROOT_PASSWORD:certichainsecret}
    bucket: ${MINIO_BUCKET:certichain}
  ocr:
    url: ${OCR_URL:http://localhost:8070}
  public-url: ${PUBLIC_APP_URL:http://localhost:5173}
  signing:
    private-key: ${CERTICHAIN_SIGNING_PRIVATE_KEY:}
    public-key: ${CERTICHAIN_SIGNING_PUBLIC_KEY:}
  scan:
    host: ${CLAMAV_HOST:}
    port: ${CLAMAV_PORT:3310}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
